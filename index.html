<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>今週の金融テスト｜竹中さん専用</title>
<style>
:root {
  --blue: #04137D;
  --blue-light: #e8ebf7;
  --green: #0a8a4e;
  --green-bg: #e6f6ee;
  --red: #c0392b;
  --red-bg: #fdecea;
  --gray: #f5f6f8;
  --gold: #b8860b;
  --text: #222;
  --muted: #777;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--gray); color: var(--text); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

header { background: var(--blue); color: #fff; padding: 14px 16px; }
header h1 { font-size: 17px; font-weight: 700; }
header .sub { font-size: 12px; opacity: .8; margin-top: 2px; }

main { flex: 1; padding: 16px; }
.card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 14px; }
.hidden { display: none !important; }
.center { text-align: center; }
.muted { color: var(--muted); font-size: 13px; }
.btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--blue); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
.btn:disabled { opacity: .5; }
.btn.sub { background: #fff; color: var(--blue); border: 2px solid var(--blue); margin-top: 10px; }

/* クイズ */
.progressBar { height: 8px; background: #e3e5ea; border-radius: 4px; overflow: hidden; margin: 10px 0 4px; }
.progressBar > div { height: 100%; background: var(--blue); border-radius: 4px; transition: width .3s; }
.qCat { display: inline-block; background: var(--blue-light); color: var(--blue); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; margin-bottom: 10px; }
.qText { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
.choices button { display: block; width: 100%; text-align: left; padding: 13px 14px; margin-bottom: 10px; border: 1.5px solid #d8dbe4; border-radius: 12px; background: #fff; font-size: 15px; cursor: pointer; line-height: 1.5; }
.choices button.correct { border-color: var(--green); background: var(--green-bg); font-weight: 700; }
.choices button.wrong { border-color: var(--red); background: var(--red-bg); }
.choices button:disabled { cursor: default; opacity: .9; }
.resultBox { border-radius: 12px; padding: 14px; margin-top: 6px; }
.resultBox.ok { background: var(--green-bg); }
.resultBox.ng { background: var(--red-bg); }
.resultBox .mark { font-size: 18px; font-weight: 800; }
.resultBox.ok .mark { color: var(--green); }
.resultBox.ng .mark { color: var(--red); }
.resultBox .exp { font-size: 14px; margin-top: 6px; }
.srcLink { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--blue); font-weight: 700; text-decoration: none; }
.bigNum { font-size: 42px; font-weight: 800; color: var(--blue); }
.best { font-size: 14px; margin-top: 6px; color: var(--gold); font-weight: 700; }

.spinner { text-align: center; padding: 30px; color: var(--muted); }

#reviewBox { text-align: left; }
.reviewItem { border: 1px solid #eee; border-left: 4px solid var(--red); border-radius: 10px; padding: 12px 14px; margin-top: 10px; background: #fff; }
.reviewItem.okItem { border-left-color: var(--green); }
.reviewItem .rq { font-weight: 700; font-size: 14px; }
.reviewItem .ra { color: var(--green); font-size: 13px; font-weight: 700; margin-top: 5px; }
.reviewItem .rw { color: var(--red); font-size: 13px; margin-top: 2px; }
.reviewItem .rexp { font-size: 13px; color: #555; margin-top: 5px; }
.reviewTitle { font-weight: 800; font-size: 15px; margin-top: 18px; }
footer { text-align: center; font-size: 11px; color: #aaa; padding: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📈 今週の金融テスト</h1>
    <div class="sub" id="weekLabel">読み込み中…</div>
  </header>

  <main>
    <div id="loading" class="spinner">読み込み中…</div>

    <!-- ホーム -->
    <div id="home" class="card center hidden">
      <p style="font-size:17px;font-weight:800;" id="homeTitle"></p>
      <p class="muted" id="homeDesc" style="margin-top:6px;"></p>
      <p class="best hidden" id="homeBest"></p>
      <div style="margin-top:16px;">
        <button class="btn" onclick="startQuiz()">テストをはじめる</button>
      </div>
    </div>

    <!-- 出題中 -->
    <div id="play" class="hidden">
      <div class="card">
        <div class="muted" id="qCounter"></div>
        <div class="progressBar"><div id="qProg" style="width:0%"></div></div>
        <span class="qCat" id="qCat"></span>
        <p class="qText" id="qText"></p>
        <div class="choices" id="qChoices"></div>
        <div id="qResult" class="hidden"></div>
        <button class="btn hidden" id="nextBtn" onclick="nextQuestion()" style="margin-top:14px;"></button>
      </div>
    </div>

    <!-- 結果 -->
    <div id="done" class="card center hidden">
      <p style="font-size:17px;font-weight:800;" id="doneTitle"></p>
      <p class="bigNum" id="doneScore"></p>
      <p class="muted">今回の正解数</p>
      <p class="best" id="doneBest"></p>
      <div id="reviewBox"></div>
      <button class="btn sub" onclick="location.reload()" style="margin-top:16px;">もう一度チャレンジ</button>
    </div>
  </main>

  <footer>竹中さん専用｜毎週日曜、その週の金融お題から自動出題</footer>
</div>

<script>
let quiz = null;      // { week, generated, questions:[...] }
let qIndex = 0;
let correctCount = 0;

function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
function escHtml(s) { const d = document.createElement('div'); d.textContent = (s == null ? '' : s); return d.innerHTML; }

// questions.json はキャッシュされやすいので毎回鮮度優先で取得
fetch('questions.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    quiz = data;
    hide('loading');
    document.getElementById('weekLabel').textContent = quiz.week ? ('対象：' + quiz.week) : '';
    const n = (quiz.questions || []).length;
    document.getElementById('homeTitle').textContent = '今週の ' + n + ' 問に挑戦';
    document.getElementById('homeDesc').textContent = 'この1週間で学んだ金融お題からの出題です。サクッと解いて定着を確認しましょう。';
    const best = loadBest();
    if (best) {
      document.getElementById('homeBest').textContent = '🏆 この週のベスト：' + best.score + ' / ' + n;
      show('homeBest');
    }
    show('home');
  })
  .catch(() => {
    document.getElementById('loading').textContent = '問題を読み込めませんでした。時間をおいて再読み込みしてください。';
  });

function weekKey() { return 'fq_best_' + (quiz && quiz.week ? quiz.week : 'default'); }
function loadBest() { try { return JSON.parse(localStorage.getItem(weekKey())); } catch (e) { return null; } }
function saveBest(score, total) {
  const cur = loadBest();
  if (!cur || score > cur.score) localStorage.setItem(weekKey(), JSON.stringify({ score: score, total: total }));
}

function startQuiz() {
  qIndex = 0; correctCount = 0;
  quiz.questions.forEach(q => delete q.done);
  hide('home'); show('play');
  renderQuestion();
}

function renderQuestion() {
  const q = quiz.questions[qIndex];
  const total = quiz.questions.length;
  document.getElementById('qCounter').textContent = '第 ' + (qIndex + 1) + ' 問 / 全 ' + total + ' 問';
  document.getElementById('qProg').style.width = Math.round(qIndex / total * 100) + '%';
  document.getElementById('qCat').textContent = q.cat || '';
  document.getElementById('qText').textContent = q.q;
  const box = document.getElementById('qChoices');
  box.innerHTML = '';
  q.c.forEach((c, i) => {
    const b = document.createElement('button');
    b.textContent = (i + 1) + '. ' + c;
    b.onclick = () => answer(i + 1, b);
    box.appendChild(b);
  });
  hide('qResult'); hide('nextBtn');
}

function answer(choice, btnEl) {
  const q = quiz.questions[qIndex];
  Array.from(document.getElementById('qChoices').children).forEach(b => b.disabled = true);
  const correct = (choice === q.a);
  const buttons = document.getElementById('qChoices').children;
  buttons[q.a - 1].classList.add('correct');
  if (!correct) btnEl.classList.add('wrong');
  else correctCount++;
  q.done = { choice: choice, correct: correct };

  const r = document.getElementById('qResult');
  r.className = 'resultBox ' + (correct ? 'ok' : 'ng');
  r.innerHTML =
    '<span class="mark">' + (correct ? '⭕ 正解！' : '❌ 不正解') + '</span>' +
    '<p class="exp">' + escHtml(q.exp) + '</p>' +
    (q.src ? '<span class="muted">出典：' + escHtml(q.src) + '</span>' : '') +
    (q.url ? '<br><a class="srcLink" href="' + escHtml(q.url) + '" target="_blank" rel="noopener">📖 Notionでお題を読み返す →</a>' : '');
  show('qResult');
  document.getElementById('nextBtn').textContent = (qIndex + 1 < quiz.questions.length) ? '次の問題へ' : '結果を見る';
  show('nextBtn');
}

function nextQuestion() {
  if (qIndex + 1 < quiz.questions.length) { qIndex++; renderQuestion(); return; }
  showDone();
}

function showDone() {
  hide('play'); show('done');
  const total = quiz.questions.length;
  saveBest(correctCount, total);
  const pct = Math.round(correctCount / total * 100);
  document.getElementById('doneTitle').textContent =
    pct === 100 ? '🎉 満点！完璧です' : pct >= 70 ? '✅ よくできました' : '📚 復習でしっかり定着を';
  document.getElementById('doneScore').textContent = correctCount + ' / ' + total;
  const best = loadBest();
  document.getElementById('doneBest').textContent = best ? ('🏆 この週のベスト：' + best.score + ' / ' + total) : '';
  renderReview();
}

function renderReview() {
  const box = document.getElementById('reviewBox');
  const wrong = quiz.questions.filter(x => x.done && !x.done.correct);
  if (wrong.length === 0) {
    box.innerHTML = '<p class="muted" style="margin-top:14px;">全問正解！この週の復習はありません。</p>';
    return;
  }
  box.innerHTML =
    '<p class="reviewTitle">📖 復習（間違えた ' + wrong.length + ' 問）</p>' +
    wrong.map(x =>
      '<div class="reviewItem">' +
      '<p class="rq">' + escHtml(x.q) + '</p>' +
      '<p class="ra">⭕ 正解：' + escHtml(x.c[x.a - 1]) + '</p>' +
      (x.done.choice ? '<p class="rw">❌ あなたの回答：' + escHtml(x.c[x.done.choice - 1] || '') + '</p>' : '') +
      '<p class="rexp">' + escHtml(x.exp) + '</p>' +
      (x.url ? '<a class="srcLink" href="' + escHtml(x.url) + '" target="_blank" rel="noopener">📖 お題を読み返す（' + escHtml(x.src || '') + '）→</a>' : '') +
      '</div>'
    ).join('');
}
</script>
</body>
</html>
