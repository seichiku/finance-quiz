<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>今日の小テスト｜竹中さん専用</title>
<style>
:root {
  --blue: #04137D; --blue-light: #e8ebf7;
  --green: #0a8a4e; --green-bg: #e6f6ee;
  --red: #c0392b; --red-bg: #fdecea;
  --gray: #f5f6f8; --gold: #b8860b; --text: #222; --muted: #777;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--gray); color: var(--text); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
header { background: var(--blue); color: #fff; padding: 14px 16px 0; }
header h1 { font-size: 17px; font-weight: 700; }
header .sub { font-size: 12px; opacity: .8; margin-top: 2px; }
.tabs { display: flex; gap: 6px; margin-top: 10px; }
.tabs button { flex: 1; border: none; background: rgba(255,255,255,.15); color: #fff; padding: 10px 4px; font-size: 13px; font-weight: 700; border-radius: 10px 10px 0 0; cursor: pointer; line-height: 1.3; }
.tabs button.active { background: var(--gray); color: var(--blue); }
.tabs button .done { display: block; font-size: 11px; font-weight: 400; opacity: .85; }
main { flex: 1; padding: 16px; }
.card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 14px; }
.hidden { display: none !important; }
.center { text-align: center; }
.muted { color: var(--muted); font-size: 13px; }
.btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--blue); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
.btn.sub { background: #fff; color: var(--blue); border: 2px solid var(--blue); margin-top: 10px; }
.progressBar { height: 8px; background: #e3e5ea; border-radius: 4px; overflow: hidden; margin: 10px 0 4px; }
.progressBar > div { height: 100%; background: var(--blue); border-radius: 4px; transition: width .3s; }
.qCat { display: inline-block; background: var(--blue-light); color: var(--blue); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; margin-bottom: 10px; }
.qText { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
.choices button { display: block; width: 100%; text-align: left; padding: 13px 14px; margin-bottom: 10px; border: 1.5px solid #d8dbe4; border-radius: 12px; background: #fff; font-size: 15px; cursor: pointer; line-height: 1.5; }
.choices button.correct { border-color: var(--green); background: var(--green-bg); font-weight: 700; }
.choices button.wrong { border-color: var(--red); background: var(--red-bg); }
.choices button:disabled { cursor: default; opacity: .9; }
.resultBox { border-radius: 12px; padding: 14px; margin-top: 6px; }
.resultBox.ok { background: var(--green-bg); }
.resultBox.ng { background: var(--red-bg); }
.resultBox .mark { font-size: 18px; font-weight: 800; }
.resultBox.ok .mark { color: var(--green); }
.resultBox.ng .mark { color: var(--red); }
.resultBox .exp { font-size: 14px; margin-top: 6px; }
.srcLink { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--blue); font-weight: 700; text-decoration: none; }
.bigNum { font-size: 42px; font-weight: 800; color: var(--blue); }
.best { font-size: 14px; margin-top: 6px; color: var(--gold); font-weight: 700; }
.spinner { text-align: center; padding: 30px; color: var(--muted); }
.reviewItem { border: 1px solid #eee; border-left: 4px solid var(--red); border-radius: 10px; padding: 12px 14px; margin-top: 10px; background: #fff; text-align: left; }
.reviewItem .rq { font-weight: 700; font-size: 14px; }
.reviewItem .ra { color: var(--green); font-size: 13px; font-weight: 700; margin-top: 5px; }
.reviewItem .rw { color: var(--red); font-size: 13px; margin-top: 2px; }
.reviewItem .rexp { font-size: 13px; color: #555; margin-top: 5px; }
.reviewTitle { font-weight: 800; font-size: 15px; margin-top: 18px; }
footer { text-align: center; font-size: 11px; color: #aaa; padding: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📝 今日の小テスト</h1>
    <div class="sub" id="dateLabel">読み込み中…</div>
    <div class="tabs" id="tabs"></div>
  </header>

  <main>
    <div id="loading" class="spinner">読み込み中…</div>

    <div id="home" class="card center hidden">
      <p style="font-size:17px;font-weight:800;" id="homeTitle"></p>
      <p class="muted" id="homeDesc" style="margin-top:6px;"></p>
      <p class="best hidden" id="homeBest"></p>
      <div style="margin-top:16px;" id="homeBtnBox">
        <button class="btn" onclick="startQuiz()">5問をはじめる</button>
      </div>
    </div>

    <div id="play" class="hidden">
      <div class="card">
        <div class="muted" id="qCounter"></div>
        <div class="progressBar"><div id="qProg" style="width:0%"></div></div>
        <span class="qCat" id="qCat"></span>
        <p class="qText" id="qText"></p>
        <div class="choices" id="qChoices"></div>
        <div id="qResult" class="hidden"></div>
        <button class="btn hidden" id="nextBtn" onclick="nextQuestion()" style="margin-top:14px;"></button>
      </div>
    </div>

    <div id="done" class="card center hidden">
      <p style="font-size:17px;font-weight:800;" id="doneTitle"></p>
      <p class="bigNum" id="doneScore"></p>
      <p class="muted">今回の正解数</p>
      <p class="best" id="doneBest"></p>
      <div id="reviewBox"></div>
      <button class="btn sub" onclick="goHome()" style="margin-top:16px;">このセットをもう一度</button>
      <button class="btn sub hidden" id="nextSetBtn" onclick="nextSet()">次のセットへ →</button>
    </div>
  </main>

  <footer>竹中さん専用｜火・木・土の10時に自動出題（金融・マイキークラブ・三類法）</footer>
</div>

<script>
// questions.json v2: { version:2, date:"YYYY-MM-DD", label:"10/10(土)", generated:"…",
//   sets:[ { key, title, range, questions:[{id,cat,q,c[4],a(1-4),exp,src,url}] }, … ] }
const SET_META = {
  finance: { title: '📈 今日の金融', short: '📈 金融', desc: '直近の「今日の金融」からの出題です。' },
  mikey:   { title: '🎓 マイキークラブ', short: '🎓 マイキー', desc: '前回のマイキークラブ講義ノートからの出題です。' },
  sanrui:  { title: '📜 今日の三類法', short: '📜 三類法', desc: '直近の「今日の三類法」からの出題です。' }
};
let data = null, set = null, qIndex = 0, correctCount = 0;

function $(id) { return document.getElementById(id); }
function show(id) { $(id).classList.remove('hidden'); }
function hide(id) { $(id).classList.add('hidden'); }
function escHtml(s) { const d = document.createElement('div'); d.textContent = (s == null ? '' : s); return d.innerHTML; }
function meta(s) { return SET_META[s.key] || { title: s.title || s.key, short: s.title || s.key, desc: '' }; }
function bestKey(s) { return 'fq2_' + (data.date || 'x') + '_' + s.key; }
function loadBest(s) { try { return JSON.parse(localStorage.getItem(bestKey(s))); } catch (e) { return null; } }
function saveBest(s, score, total) {
  try { const cur = loadBest(s); if (!cur || score > cur.score) localStorage.setItem(bestKey(s), JSON.stringify({ score, total })); } catch (e) {}
}

fetch('questions.json?t=' + Date.now())
  .then(r => r.json())
  .then(d => {
    data = d;
    if (!data.sets) { // 旧形式（v1）の救済
      data.sets = [{ key: 'finance', title: '📈 今週の金融テスト', range: data.week || '', questions: data.questions || [] }];
    }
    data.sets = data.sets.filter(s => s && s.questions && s.questions.length);
    hide('loading');
    $('dateLabel').textContent = (data.label || data.date || '') + (data.sets.length ? '｜' + data.sets.length + 'セット' : '');
    renderTabs();
    if (!data.sets.length) { $('loading').textContent = '今日の出題はありません。'; show('loading'); return; }
    selectSet(0);
  })
  .catch(() => { $('loading').textContent = '問題を読み込めませんでした。時間をおいて再読み込みしてください。'; });

function renderTabs() {
  const box = $('tabs'); box.innerHTML = '';
  data.sets.forEach((s, i) => {
    const b = document.createElement('button');
    const best = loadBest(s);
    b.innerHTML = escHtml(meta(s).short) + '<span class="done">' + (best ? ('🏆 ' + best.score + '/' + best.total) : s.questions.length + '問') + '</span>';
    b.onclick = () => selectSet(i);
    b.dataset.i = i;
    box.appendChild(b);
  });
}
function markTab(i) { Array.from($('tabs').children).forEach(b => b.classList.toggle('active', Number(b.dataset.i) === i)); }

function selectSet(i) {
  set = data.sets[i]; set._i = i; markTab(i);
  goHome();
}

function goHome() {
  hide('play'); hide('done'); show('home');
  const m = meta(set), n = set.questions.length;
  $('homeTitle').textContent = m.title + '　' + n + '問';
  $('homeDesc').textContent = (set.range ? '出題範囲：' + set.range + '　' : '') + m.desc;
  const best = loadBest(set);
  if (best) { $('homeBest').textContent = '🏆 今日のベスト：' + best.score + ' / ' + n; show('homeBest'); } else hide('homeBest');
  window.scrollTo(0, 0);
}

function startQuiz() {
  qIndex = 0; correctCount = 0;
  set.questions.forEach(q => delete q.done);
  hide('home'); hide('done'); show('play');
  renderQuestion();
}

function renderQuestion() {
  const q = set.questions[qIndex], total = set.questions.length;
  $('qCounter').textContent = meta(set).short + '｜第 ' + (qIndex + 1) + ' 問 / 全 ' + total + ' 問';
  $('qProg').style.width = Math.round(qIndex / total * 100) + '%';
  $('qCat').textContent = q.cat || '';
  $('qText').textContent = q.q;
  const box = $('qChoices'); box.innerHTML = '';
  q.c.forEach((c, i) => {
    const b = document.createElement('button');
    b.textContent = (i + 1) + '. ' + c;
    b.onclick = () => answer(i + 1, b);
    box.appendChild(b);
  });
  hide('qResult'); hide('nextBtn');
  window.scrollTo(0, 0);
}

function answer(choice, btnEl) {
  const q = set.questions[qIndex];
  const buttons = $('qChoices').children;
  Array.from(buttons).forEach(b => b.disabled = true);
  const correct = (choice === q.a);
  buttons[q.a - 1].classList.add('correct');
  if (!correct) btnEl.classList.add('wrong'); else correctCount++;
  q.done = { choice, correct };
  const r = $('qResult');
  r.className = 'resultBox ' + (correct ? 'ok' : 'ng');
  r.innerHTML =
    '<span class="mark">' + (correct ? '⭕ 正解！' : '❌ 不正解') + '</span>' +
    '<p class="exp">' + escHtml(q.exp) + '</p>' +
    (q.src ? '<span class="muted">出典：' + escHtml(q.src) + '</span>' : '') +
    (q.url ? '<br><a class="srcLink" href="' + escHtml(q.url) + '" target="_blank" rel="noopener">📖 Notionで読み返す →</a>' : '');
  show('qResult');
  $('nextBtn').textContent = (qIndex + 1 < set.questions.length) ? '次の問題へ' : '結果を見る';
  show('nextBtn');
}

function nextQuestion() {
  if (qIndex + 1 < set.questions.length) { qIndex++; renderQuestion(); return; }
  showDone();
}

function showDone() {
  hide('play'); show('done');
  const total = set.questions.length;
  saveBest(set, correctCount, total);
  renderTabs(); markTab(set._i);
  const pct = Math.round(correctCount / total * 100);
  $('doneTitle').textContent = pct === 100 ? '🎉 満点！完璧です' : pct >= 60 ? '✅ よくできました' : '📚 読み返して定着を';
  $('doneScore').textContent = correctCount + ' / ' + total;
  const best = loadBest(set);
  $('doneBest').textContent = best ? ('🏆 今日のベスト：' + best.score + ' / ' + total) : '';
  renderReview();
  if (set._i + 1 < data.sets.length) show('nextSetBtn'); else hide('nextSetBtn');
  window.scrollTo(0, 0);
}
function nextSet() { selectSet(set._i + 1); }

function renderReview() {
  const box = $('reviewBox');
  const wrong = set.questions.filter(x => x.done && !x.done.correct);
  if (!wrong.length) { box.innerHTML = '<p class="muted" style="margin-top:14px;">全問正解！復習はありません。</p>'; return; }
  box.innerHTML = '<p class="reviewTitle">📖 復習（間違えた ' + wrong.length + ' 問）</p>' +
    wrong.map(x =>
      '<div class="reviewItem">' +
      '<p class="rq">' + escHtml(x.q) + '</p>' +
      '<p class="ra">⭕ 正解：' + escHtml(x.c[x.a - 1]) + '</p>' +
      '<p class="rw">❌ あなたの回答：' + escHtml(x.c[x.done.choice - 1] || '') + '</p>' +
      '<p class="rexp">' + escHtml(x.exp) + '</p>' +
      (x.url ? '<a class="srcLink" href="' + escHtml(x.url) + '" target="_blank" rel="noopener">📖 読み返す（' + escHtml(x.src || '') + '）→</a>' : '') +
      '</div>').join('');
}
</script>
</body>
</html>
